<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FreshMarket App | Supermercado Móvil</title>

    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ==========================================================================
           CSS RESET & BASE DESIGN TOKENS
           ========================================================================== */
        :root {
            --primary-50: #f0fdf4;
            --primary-100: #dcfce7;
            --primary-500: #22c55e;
            --primary-600: #16a34a;
            --primary-700: #15803d;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-600: #475569;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 20px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 16px 32px rgba(0, 0, 0, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f172a;
            color: var(--gray-800);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* Mobile Container Layout Framework */
        .app-viewport {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 920px;
            background: #ffffff;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        @media (min-width: 640px) {
            .app-viewport {
                border-radius: var(--radius-lg);
                height: 95vh;
            }
        }

        /* Header Bar */
        .app-header {
            padding: 16px 20px 12px;
            background: #ffffff;
            sticky: top;
            z-index: 20;
            border-bottom: 1px solid var(--gray-100);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--primary-500), var(--primary-700));
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.25);
        }

        .brand-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--gray-900);
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            font-size: 10px;
            color: var(--primary-600);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Search input */
        .search-box {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background-color: var(--gray-100);
            border: 1.5px solid transparent;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 500;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            background-color: #ffffff;
            border-color: var(--primary-500);
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
            font-size: 14px;
        }

        /* Scrollable Main Area */
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 90px;
            scroll-behavior: smooth;
        }

        /* Banner Carousel */
        .promo-banner {
            margin: 16px 20px;
            padding: 20px;
            background: linear-gradient(135deg, #059669, #10b981);
            border-radius: var(--radius-md);
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.2);
        }

        .promo-tag {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .promo-title {
            font-size: 20px;
            font-weight: 800;
            margin: 8px 0 4px;
            line-height: 1.2;
        }

        .promo-desc {
            font-size: 12px;
            opacity: 0.9;
        }

        .promo-decor {
            position: absolute;
            right: -10px;
            bottom: -10px;
            font-size: 100px;
            opacity: 0.15;
        }

        /* Category Selector Carousel */
        .section-header {
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--gray-900);
        }

        .category-carousel {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 0 20px 8px;
            scrollbar-width: none;
        }

        .category-carousel::-webkit-scrollbar {
            display: none;
        }

        .category-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background-color: var(--gray-100);
            border-radius: var(--radius-sm);
            white-space: nowrap;
            font-size: 12px;
            font-weight: 600;
            color: var(--gray-600);
            cursor: pointer;
            border: 1.5px solid transparent;
            transition: all 0.2s ease;
        }

        .category-chip.active {
            background-color: var(--primary-50);
            border-color: var(--primary-500);
            color: var(--primary-700);
        }

        /* Product Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            padding: 0 20px;
        }

        .product-card {
            background: #ffffff;
            border-radius: var(--radius-md);
            border: 1px solid var(--gray-200);
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:active {
            transform: scale(0.98);
        }

        .product-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--accent-rose);
            color: white;
            font-size: 9px;
            font-weight: 800;
            padding: 3px 6px;
            border-radius: 6px;
            z-index: 2;
        }

        .product-img-wrap {
            width: 100%;
            height: 110px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            background-color: var(--gray-50);
            margin-bottom: 8px;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--gray-800);
            margin-bottom: 4px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        .product-price {
            font-size: 15px;
            font-weight: 800;
            color: var(--primary-700);
        }

        .btn-add {
            width: 32px;
            height: 32px;
            background: var(--primary-500);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-add:active {
            background-color: var(--primary-700);
        }

        /* Fixed Bottom Navigation Bar */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--gray-200);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 30;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: var(--gray-400);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            width: 25%;
        }

        .nav-item i {
            font-size: 18px;
        }

        .nav-item.active {
            color: var(--primary-600);
        }

        .cart-badge-count {
            position: absolute;
            top: -4px;
            right: 22px;
            background: var(--accent-amber);
            color: var(--gray-900);
            font-size: 10px;
            font-weight: 800;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Slide Drawer Carrito */
        .drawer-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(2px);
            z-index: 40;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .drawer-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .cart-drawer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 85%;
            background: white;
            border-radius: 24px 24px 0 0;
            z-index: 50;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            display: flex;
            flex-direction: column;
        }

        .cart-drawer.active {
            transform: translateY(0);
        }

        .drawer-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--gray-100);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drawer-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--gray-900);
        }

        .btn-close {
            background: var(--gray-100);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            color: var(--gray-600);
            cursor: pointer;
        }

        .cart-items-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: var(--gray-50);
            border-radius: var(--radius-sm);
        }

        .cart-item-img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-size: 12px;
            font-weight: 700;
            color: var(--gray-800);
        }

        .cart-item-price {
            font-size: 12px;
            font-weight: 800;
            color: var(--primary-700);
            margin-top: 2px;
        }

        .cart-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #ffffff;
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px solid var(--gray-200);
        }

        .btn-qty {
            border: none;
            background: none;
            font-weight: 800;
            color: var(--gray-800);
            width: 20px;
            cursor: pointer;
        }

        .cart-summary {
            padding: 20px;
            background: var(--gray-50);
            border-top: 1px solid var(--gray-200);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--gray-600);
        }

        .summary-row.total {
            font-size: 16px;
            font-weight: 800;
            color: var(--gray-900);
            padding-top: 8px;
            border-top: 1px dashed var(--gray-300);
        }

        .btn-checkout {
            width: 100%;
            padding: 14px;
            background: var(--primary-600);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 14px;
            margin-top: 8px;
            cursor: pointer;
        }

        /* Toast Feedback */
        .toast {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--gray-900);
            color: white;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 60;
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            box-shadow: var(--shadow-lg);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="app-viewport">

        <!-- Toast Feedback -->
        <div id="toast" class="toast">
            <i class="fa-solid fa-circle-check" style="color: var(--primary-500)"></i>
            <span id="toast-text">Producto agregado</span>
        </div>

        <!-- App Header -->
        <header class="app-header">
            <div class="header-top">
                <div class="brand-logo">
                    <div class="brand-icon">
                        <i class="fa-solid fa-basket-shopping"></i>
                    </div>
                    <div>
                        <div class="brand-title">FreshMarket</div>
                        <div class="brand-subtitle">Entrega Rápida</div>
                    </div>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Buscar frutas, carnes, lácteos...">
            </div>
        </header>

        <!-- Main Scrollable Body -->
        <main class="app-content">

            <!-- Banner Carousel -->
            <div class="promo-banner">
                <span class="promo-tag">Oferta Express</span>
                <div class="promo-title">Verduras 100% Orgánicas</div>
                <div class="promo-desc">Hasta 25% OFF en tu primer pedido hoy</div>
                <i class="fa-solid fa-carrot promo-decor"></i>
            </div>

            <!-- Dynamic Categories Scroll Carousel -->
            <div class="section-header">
                <div class="section-title">Categorías</div>
            </div>

            <div class="category-carousel" id="categoriesContainer">
                <!-- Dynamic Chips -->
            </div>

            <!-- Products View Grid -->
            <div class="section-header" style="margin-top: 16px;">
                <div class="section-title" id="gridTitle">Productos Destacados</div>
            </div>

            <div class="products-grid" id="productsGrid">
                <!-- Dynamic Cards -->
            </div>

        </main>

        <!-- Bottom Navigation Mobile Bar -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('home')">
                <i class="fa-solid fa-house"></i>
                <span>Inicio</span>
            </button>
            <button class="nav-item" onclick="switchTab('categories')">
                <i class="fa-solid fa-border-all"></i>
                <span>Secciones</span>
            </button>
            <button class="nav-item" onclick="toggleCartDrawer(true)">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>Carrito</span>
                <div class="cart-badge-count" id="cartBadge">0</div>
            </button>
            <button class="nav-item" onclick="switchTab('profile')">
                <i class="fa-solid fa-user"></i>
                <span>Perfil</span>
            </button>
        </nav>

        <!-- Cart Backdrop -->
        <div class="drawer-backdrop" id="drawerBackdrop" onclick="toggleCartDrawer(false)"></div>

        <!-- Slide Drawer Carrito -->
        <div class="cart-drawer" id="cartDrawer">
            <div class="drawer-header">
                <div class="drawer-title">Tu Carrito</div>
                <button class="btn-close" onclick="toggleCartDrawer(false)">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="cart-items-list" id="cartItemsList">
                <!-- Dynamic Cart Items -->
            </div>

            <div class="cart-summary">
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotalVal">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Envío</span>
                    <span id="shippingVal" style="color: var(--primary-600); font-weight:700;">$0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span id="totalVal">$0.00</span>
                </div>
                <button class="btn-checkout" onclick="checkout()">
                    Procesar Compra
                </button>
            </div>
        </div>

    </div>

    <script>
        // ==========================================================================
        // FRESHMARKET CORE JAVASCRIPT MODULE
        // ==========================================================================

        // Mock Database Store
        const categories = [
            { id: 'all', name: 'Todos', icon: 'fa-border-all' },
            { id: 'frutas', name: 'Frutas y Verduras', icon: 'fa-apple-whole' },
            { id: 'lacteos', name: 'Lácteos', icon: 'fa-cheese' },
            { id: 'carnes', name: 'Carnes', icon: 'fa-drumstick-bite' },
            { id: 'bebidas', name: 'Bebidas', icon: 'fa-bottle-water' },
            { id: 'limpieza', name: 'Limpieza', icon: 'fa-pump-soap' }
        ];

        const products = [
            { id: 1, name: 'Manzana Red (Kg)', category: 'frutas', price: 2.99, badge: '-20%', image: 'https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?auto=format&fit=crop&q=80&w=300' },
            { id: 2, name: 'Leche Descremada 1L', category: 'lacteos', price: 1.50, badge: 'Oferta', image: 'https://images.unsplash.com/photo-1563636619-e9143da7973b?auto=format&fit=crop&q=80&w=300' },
            { id: 3, name: 'Pechuga de Pollo 500g', category: 'carnes', price: 4.20, badge: null, image: 'https://images.unsplash.com/photo-1604503468506-a8da13d82791?auto=format&fit=crop&q=80&w=300' },
            { id: 4, name: 'Jugo de Naranja 1L', category: 'bebidas', price: 2.10, badge: 'Fresco', image: 'https://images.unsplash.com/photo-1613478223719-2ab802602423?auto=format&fit=crop&q=80&w=300' },
            { id: 5, name: 'Detergente Líquido 1L', category: 'limpieza', price: 3.80, badge: null, image: 'https://images.unsplash.com/photo-1610557892470-55d9e80c0bce?auto=format&fit=crop&q=80&w=300' },
            { id: 6, name: 'Aguacate Hass (Kg)', category: 'frutas', price: 3.50, badge: 'Top', image: 'https://images.unsplash.com/photo-1523049673857-eb18f1d7b578?auto=format&fit=crop&q=80&w=300' }
        ];

        // State Machine
        let activeCategory = 'all';
        let cart = [];

        // DOM Elements Initializer
        const categoriesContainer = document.getElementById('categoriesContainer');
        const productsGrid = document.getElementById('productsGrid');
        const searchInput = document.getElementById('searchInput');
        const cartBadge = document.getElementById('cartBadge');
        const cartDrawer = document.getElementById('cartDrawer');
        const drawerBackdrop = document.getElementById('drawerBackdrop');
        const cartItemsList = document.getElementById('cartItemsList');
        const subtotalVal = document.getElementById('subtotalVal');
        const shippingVal = document.getElementById('shippingVal');
        const totalVal = document.getElementById('totalVal');

        // Render Category Filter Chips
        function renderCategories() {
            categoriesContainer.innerHTML = categories.map(cat => `
                <div class="category-chip ${cat.id === activeCategory ? 'active' : ''}" onclick="selectCategory('${cat.id}')">
                    <i class="fa-solid ${cat.icon}"></i>
                    <span>${cat.name}</span>
                </div>
            `).join('');
        }

        // Render Dynamic Product Cards Grid
        function renderProducts(query = '') {
            const filtered = products.filter(p => {
                const matchCat = activeCategory === 'all' || p.category === activeCategory;
                const matchQuery = p.name.toLowerCase().includes(query.toLowerCase());
                return matchCat && matchQuery;
            });

            if (filtered.length === 0) {
                productsGrid.innerHTML = `
                    <div style="grid-column: span 2; text-align: center; padding: 40px 0; color: var(--gray-400);">
                        <i class="fa-solid fa-magnifying-glass" style="font-size: 32px; margin-bottom: 8px;"></i>
                        <p style="font-size: 12px;">No se encontraron productos</p>
                    </div>
                `;
                return;
            }

            productsGrid.innerHTML = filtered.map(p => `
                <div class="product-card">
                    ${p.badge ? `<span class="product-badge">${p.badge}</span>` : ''}
                    <div class="product-img-wrap">
                        <img src="${p.image}" class="product-img" alt="${p.name}">
                    </div>
                    <div class="product-name">${p.name}</div>
                    <div class="product-bottom">
                        <div class="product-price">$${p.price.toFixed(2)}</div>
                        <button class="btn-add" onclick="addToCart(${p.id})">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Category Filter Controller
        function selectCategory(catId) {
            activeCategory = catId;
            renderCategories();
            renderProducts(searchInput.value);
        }

        // Search Autocomplete Controller
        searchInput.addEventListener('input', (e) => {
            renderProducts(e.target.value);
        });

        // Cart Actions
        function addToCart(id) {
            const prod = products.find(p => p.id === id);
            const exist = cart.find(item => item.id === id);

            if (exist) {
                exist.qty++;
            } else {
                cart.push({ ...prod, qty: 1 });
            }

            updateCartUI();
            showToast(`Añadido: ${prod.name}`);
        }

        function updateQty(id, change) {
            const item = cart.find(i => i.id === id);
            if (!item) return;

            item.qty += change;
            if (item.qty <= 0) {
                cart = cart.filter(i => i.id !== id);
            }

            updateCartUI();
        }

        // Drawer UI & Calculations
        function updateCartUI() {
            const count = cart.reduce((acc, i) => acc + i.qty, 0);
            cartBadge.textContent = count;

            if (cart.length === 0) {
                cartItemsList.innerHTML = `
                    <div style="text-align: center; padding: 40px 0; color: var(--gray-400);">
                        <i class="fa-solid fa-basket-shopping" style="font-size: 36px; margin-bottom: 8px;"></i>
                        <p style="font-size: 13px; font-weight:600;">Carrito Vacío</p>
                    </div>
                `;
            } else {
                cartItemsList.innerHTML = cart.map(i => `
                    <div class="cart-item">
                        <img src="${i.image}" class="cart-item-img" alt="${i.name}">
                        <div class="cart-item-info">
                            <div class="cart-item-name">${i.name}</div>
                            <div class="cart-item-price">$${(i.price * i.qty).toFixed(2)}</div>
                        </div>
                        <div class="cart-controls">
                            <button class="btn-qty" onclick="updateQty(${i.id}, -1)">-</button>
                            <span style="font-size:12px; font-weight:800;">${i.qty}</span>
                            <button class="btn-qty" onclick="updateQty(${i.id}, 1)">+</button>
                        </div>
                    </div>
                `).join('');
            }

            const subtotal = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
            const shipping = subtotal > 0 ? (subtotal > 15 ? 0 : 2.50) : 0;
            const total = subtotal + shipping;

            subtotalVal.textContent = `$${subtotal.toFixed(2)}`;
            shippingVal.textContent = shipping === 0 && subtotal > 0 ? 'GRATIS' : `$${shipping.toFixed(2)}`;
            totalVal.textContent = `$${total.toFixed(2)}`;
        }

        function toggleCartDrawer(show) {
            if (show) {
                cartDrawer.classList.add('active');
                drawerBackdrop.classList.add('active');
            } else {
                cartDrawer.classList.remove('active');
                drawerBackdrop.classList.remove('active');
            }
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').textContent = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function switchTab(tab) {
            showToast(`Cambiando a pestaña: ${tab}`);
        }

        function checkout() {
            if (cart.length === 0) return showToast('Agrega productos al carrito');
            showToast('¡Pedido completado con éxito!');
            cart = [];
            updateCartUI();
            toggleCartDrawer(false);
        }

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            renderCategories();
            renderProducts();
            updateCartUI();
        });
    </script>
</body>
</html>
